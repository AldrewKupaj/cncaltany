
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Altany</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f2e8;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .result {
      font-size: 18px;
      margin-top: 20px;
      font-weight: bold;
    }
    .form-section {
      margin-top: 40px;
    }
    .info {
      margin-top: 30px;
      font-size: 15px;
      background: #fdf6e3;
      padding: 15px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kalkulator altany</h1>
    <label for="width">Szerokość altany (m):</label>
    <input type="number" id="width" />

    <label for="length">Długość altany (m):</label>
    <input type="number" id="length" />

    <label for="roof">Rodzaj dachu:</label>
    <select id="roof">
      <option value="0">Jednospadowy (+0 zł)</option>
      <option value="200">Dwuspadowy (+200 zł)</option>
      <option value="300">Kopertowy (+300 zł)</option>
    </select>

    <label>
      <input type="checkbox" id="shingles" />
      + Gont do pokrycia altany
    </label>

    <label>
      <input type="checkbox" id="decorativeEnds" />
      + Zdobienia na końcach krokwi (dodatkowa opłata)
    </label>

    <button onclick="calculate()">Oblicz</button>

    <div class="result" id="result"></div>

    <div class="info">
      <p><strong>Uwaga:</strong></p>
      <ul>
        <li>Standardowa wysokość altany to 2.1 m od podłoża do słupa.</li>
        <li>Zdobienia na końcach krokwi dostępne za dodatkową opłatą – wybierz opcję powyżej.</li>
      </ul>
    </div>

    <div class="form-section">
      <h2>Wyślij zapytanie</h2>
      <form action="https://formspree.io/f/xblgbgpp" method="POST">
        <label for="name">Imię i nazwisko:</label>
        <input type="text" name="name" required />

        <label for="email">Adres e-mail:</label>
        <input type="email" name="email" required />

        <label for="message">Dodatkowe uwagi:</label>
        <textarea name="message" rows="4" placeholder="Np. niestandardowa wysokość, kolor, inne oczekiwania..."></textarea>

        <button type="submit">Wyślij zapytanie</button>
      </form>
    </div>
  </div>

  <script>
    function calculate() {
      const width = parseFloat(document.getElementById('width').value);
      const length = parseFloat(document.getElementById('length').value);
      const roofExtra = parseFloat(document.getElementById('roof').value);
      const shingles = document.getElementById('shingles').checked;
      const decorativeEnds = document.getElementById('decorativeEnds').checked;

      if (isNaN(width) || isNaN(length)) {
        document.getElementById('result').innerText = 'Podaj poprawne wymiary altany.';
        return;
      }

      const area = width * length;

      // Wyliczanie proporcjonalnie do 24 m² = 3600 zł (podstawa: KVH + Sodra + boazeria)
      const basePrice = (area / 24) * 3600;

      // Koszt boazerii + gont
      const shinglesCost = shingles ? area * 30 : 0;

      // Koszt zdobień (przykładowa dopłata 150 zł)
      const decorationCost = decorativeEnds ? 150 : 0;

      const totalPrice = Math.round(basePrice + roofExtra + shinglesCost + decorationCost);

      document.getElementById('result').innerText = `Szacunkowa cena altany: ${totalPrice} zł`;
    }
  </script>
</body>
</html>
